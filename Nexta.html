<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexta Messenger</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .tiktok-btn {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #333;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      width: 100%;
      box-sizing: border-box;
    }

    .tiktok-btn:hover {
      background-color: #111111;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(254, 44, 85, 0.3);
    }

    .tiktok-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Nexta</h1>
    <p>Увійдіть через свій акаунт TikTok, щоб продовжити спілкування</p>
    
    <button class="tiktok-btn" onclick="loginWithTikTok()">
      <svg class="tiktok-icon" viewBox="0 0 24 24">
        <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.82.56-1.31 1.56-1.28 2.55.02.83.42 1.64 1.09 2.13.82.63 1.94.79 2.92.43 1.02-.36 1.83-1.29 2.02-2.35.11-.7.06-1.42.06-2.13V.02z"/>
      </svg>
      Увійти через TikTok
    </button>
  </div>

  <script>
    // 1. Вставити свій Client Key з кабінету TikTok Developer
    const TIKTOK_CLIENT_KEY = 'sbaw4uhcbsaw2z593e'; 

    // 2. Посилання на твій GitHub Pages
    const REDIRECT_URI = encodeURIComponent('https://souznajkrasihdruziv-collab.github.io/Nexta/');

    function loginWithTikTok() {
      // Генерація безпечного стану для OAuth
      const csrfState = Math.random().toString(36).substring(2);
      
      // Формування посилання для авторизації
      const authUrl = `https://www.tiktok.com/v2/auth/authorize/` +
        `?client_key=${TIKTOK_CLIENT_KEY}` +
        `&scope=user.info.basic,video.list` +
        `&response_type=code` +
        `&redirect_uri=${REDIRECT_URI}` +
        `&state=${csrfState}`;

      // Перенаправлення користувача на TikTok
      window.location.href = authUrl;
    }
  </script>

</body>
</html>
