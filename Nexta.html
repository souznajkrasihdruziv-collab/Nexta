<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Месенджер + TikTok</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .app-container {
      width: 100%; max-width: 420px; height: 90vh;
      background: #1e1e1e; border-radius: 16px; display: flex;
      flex-direction: column; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    /* Верхні вкладки */
    .nav-tabs { display: flex; background: #2a2a2a; border-bottom: 1px solid #333; }
    .tab-btn {
      flex: 1; padding: 14px; border: none; background: transparent;
      color: #888; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px;
    }
    .tab-btn.active { color: #fff; background: #333; border-bottom: 3px solid #ff0050; }

    /* Контент вкладок */
    .tab-content { flex: 1; display: none; flex-direction: column; padding: 15px; overflow: hidden; }
    .tab-content.active { display: flex; }

    /* --- Вкладка ЧАТ --- */
    .chat-messages {
      flex: 1; padding: 10px; overflow-y: auto; display: flex;
      flex-direction: column; gap: 10px; background: #141414; border-radius: 8px;
    }
    .message {
      max-width: 80%; padding: 10px 12px; border-radius: 12px;
      font-size: 14px; line-height: 1.4; word-break: break-word; align-self: flex-start;
      background: #2a2a2a; color: #fff;
    }
    .message.my-msg { align-self: flex-end; background: #ff0050; }
    .message a { color: #61dafb; text-decoration: underline; }
    .message.my-msg a { color: #fff; font-weight: bold; }

    .chat-input { display: flex; gap: 8px; margin-top: 10px; }
    .chat-input input {
      flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #444;
      background: #2a2a2a; color: white; outline: none;
    }
    .chat-input button {
      padding: 10px 16px; background: #ff0050; color: white; border: none;
      border-radius: 20px; cursor: pointer; font-weight: bold;
    }

    /* --- Вкладка TIKTOK --- */
    .tiktok-input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .tiktok-input-group input {
      flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #444;
      background: #2a2a2a; color: white; outline: none;
    }
    .tiktok-input-group button {
      padding: 10px 14px; background: #25f4ee; color: #000; border: none;
      border-radius: 8px; cursor: pointer; font-weight: bold;
    }

    .tiktok-container {
      flex: 1; display: flex; justify-content: center; align-items: center;
      background: #000; border-radius: 12px; overflow: hidden; position: relative;
    }
    iframe { width: 100%; height: 100%; border: none; }

    .share-btn {
      margin-top: 12px; padding: 12px; background: #ff0050; color: white;
      border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
      text-align: center; display: none; width: 100%; transition: 0.2s;
    }
    .share-btn:hover { background: #e00046; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Навігаційні вкладки -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('chat')">💬 Чат</button>
    <button class="tab-btn" onclick="switchTab('tiktok')">🎵 TikTok</button>
  </div>

  <!-- Вкладка 1: Месенджер -->
  <div id="chatTab" class="tab-content active">
    <div class="chat-messages" id="messagesList"></div>
    <form class="chat-input" id="messageForm">
      <input type="text" id="msgInput" placeholder="Напишіть повідомлення..." required autocomplete="off">
      <button type="submit">></button>
    </form>
  </div>

  <!-- Вкладка 2: TikTok Плеєр -->
  <div id="tiktokTab" class="tab-content">
    <div class="tiktok-input-group">
      <input type="text" id="ttUrl" placeholder="Вставити посилання на TikTok...">
      <button onclick="loadTikTok()">Дивитися</button>
    </div>
    
    <div class="tiktok-container" id="ttContainer">
      <p style="color: #666; text-align: center; padding: 10px;">
        Встав посилання на відео з TikTok, щоб переглянути його тут!
      </p>
    </div>

    <!-- Кнопка надсилання відео у чат -->
    <button id="sendToChatBtn" class="share-btn" onclick="shareVideoToChat()">
      🚀 Надіслати це відео в чат
    </button>
  </div>
</div>

<script>
  let currentLoadedUrl = '';

  // Перемикання вкладок
  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabName === 'chat') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('chatTab').classList.add('active');
      renderMessages();
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tiktokTab').classList.add('active');
    }
  }

  // Завантаження TikTok у плеєр
  function loadTikTok() {
    const url = document.getElementById('ttUrl').value.trim();
    const container = document.getElementById('ttContainer');
    const shareBtn = document.getElementById('sendToChatBtn');

    const match = url.match(/\/video\/(\d+)/);
    
    if (match && match[1]) {
      const videoId = match[1];
      currentLoadedUrl = url;
      
      container.innerHTML = `<iframe src="https://www.tiktok.com/embed/v2/${videoId}" allowfullscreen></iframe>`;
      shareBtn.style.display = 'block'; // Показуємо кнопку надсилання
    } else {
      alert('Вкажіть коректне посилання на відео TikTok (наприклад: https://www.tiktok.com/@user/video/123456789)');
    }
  }

  // Логіка відправки відео в чат
  function shareVideoToChat() {
    if (!currentLoadedUrl) return;

    // Зберігаємо повідомлення з посиланням
    saveMessage('Я', `Дивись яке відео в TikTok: <a href="${currentLoadedUrl}" target="_blank">${currentLoadedUrl}</a>`);
    
    // Переключаємося назад у чат
    switchTab('chat');
  }

  // --- Базова робота чату (localStorage) ---
  function getMessages() {
    return JSON.parse(localStorage.getItem('tt_messenger_chat')) || [];
  }

  function saveMessage(author, text) {
    const messages = getMessages();
    messages.push({ author, text });
    localStorage.setItem('tt_messenger_chat', JSON.stringify(messages));
  }

  function renderMessages() {
    const messagesList = document.getElementById('messagesList');
    const messages = getMessages();
    messagesList.innerHTML = '';

    messages.forEach(msg => {
      const msgElement = document.createElement('div');
      const isMe = msg.author === 'Я';
      msgElement.classList.add('message', isMe ? 'my-msg' : 'other-msg');
      msgElement.innerHTML = msg.text;
      messagesList.appendChild(msgElement);
    });

    messagesList.scrollTop = messagesList.scrollHeight;
  }

  document.getElementById('messageForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('msgInput');
    if (input.value.trim()) {
      saveMessage('Я', input.value.trim());
      input.value = '';
      renderMessages();
    }
  });

  // Початковий рендер
  renderMessages();
</script>

</body>
</html>
